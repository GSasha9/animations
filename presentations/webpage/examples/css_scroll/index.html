<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CSS Scroll-Driven Animation</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #111;
      }

      .intro {
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 48px;
        font-weight: bold;
      }

      .content {
        width: min(900px, 90%);
        margin: 0 auto;
        padding: 100px 0;
      }

      .card {
        margin: 300px 0;
        padding: 50px;

        background: white;
        border-radius: 24px;

        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);

        animation: reveal linear both;
        animation-timeline: view();
        animation-range: entry 0% cover 40%;
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(250px) scale(0.7);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .card h2 {
        margin: 0 0 20px;
        font-size: 36px;
      }

      .card p {
        margin: 0;

        font-size: 20px;
        line-height: 1.6;
        color: #666;
      }
    </style>
  </head>

  <body>
    <section class="intro">Прокрути страницу ↓</section>

    <main class="content">
      <article class="card">
        <h2>Первый блок</h2>

        <p>
          Этот элемент появляется при прокрутке страницы. Для этого нам не понадобился JavaScript.
        </p>
      </article>

      <article class="card">
        <h2>Второй блок</h2>

        <p>Анимация связана непосредственно с положением элемента во viewport.</p>
      </article>

      <article class="card">
        <h2>Третий блок</h2>

        <p>CSS сам связывает прокрутку с прогрессом анимации.</p>
      </article>
    </main>
  </body>
</html>
