<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat Lens</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        font-family: Arial, sans-serif;
      }

      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      canvas {
        display: block;
        max-width: 100%;
        width: min(90vw, 640px);
        height: auto;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        background: #111827;
        cursor: crosshair;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      }

      .caption {
        color: #e2e8f0;
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="caption">Видео → Canvas → лупа</div>
      <video
        id="catVideoL"
        src="./cat.mp4"
        width="640"
        height="360"
        muted
        loop
        autoplay
        playsinline
        style="display: none"
      ></video>
      <canvas id="catCanvasL" width="640" height="360"></canvas>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
