<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Video Pixelize</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;

        display: grid;
        place-items: center;

        background: #020817;
        font-family: Arial, sans-serif;
      }

      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      canvas {
        display: block;

        width: min(90vw, 640px);
        max-width: 100%;
        height: auto;

        border: 2px solid rgba(255, 255, 255, 0.18);
        background: #111827;
        border-radius: 14px;

        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);

        cursor: crosshair;
      }

      .caption {
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #e2e8f0;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="caption">Наведи курсор — область вокруг курсора пикселизируется</div>

      <!-- Исходное видео. Оно скрыто, потому что мы рисуем его в canvas -->
      <video
        id="video"
        src="../canvas_video/cat.mp4"
        width="640"
        height="360"
        muted
        loop
        autoplay
        playsinline
        style="display: none"
      ></video>

      <!-- Здесь отображаем видео и эффект -->
      <canvas id="pixelCanvas" width="640" height="360"></canvas>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
